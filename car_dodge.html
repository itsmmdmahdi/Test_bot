<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; }
        canvas { background: #333; border-left: 5px solid #fff; border-right: 5px solid #fff; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="300" height="500"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let lane = 1, obstacles = [], score = 0, gameSpeed = 5, isRunning = true;

        function drawCar(x, y, color) {
            ctx.fillStyle = color; ctx.fillRect(x + 10, y, 30, 50);
            ctx.fillStyle = "#000"; ctx.fillRect(x + 12, y + 5, 8, 10); ctx.fillRect(x + 28, y + 5, 8, 10);
        }

        function update() {
            if (!isRunning) return;
            obstacles.forEach(o => o.y += gameSpeed);
            obstacles = obstacles.filter(o => o.y < 500);
            obstacles.forEach(o => {
                if (o.y > 400 && o.y < 460 && o.lane === lane) { isRunning = false; alert("تصادف کردی! امتیاز: " + score); location.reload(); }
            });
            if (Math.random() < 0.04) obstacles.push({ lane: Math.floor(Math.random() * 3), y: -60 });
            score++; gameSpeed += 0.002;
        }

        function draw() {
            ctx.clearRect(0, 0, 300, 500);
            ctx.strokeStyle = "#fff"; ctx.setLineDash([20, 20]);
            ctx.beginPath(); ctx.moveTo(100, 0); ctx.lineTo(100, 500); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(200, 0); ctx.lineTo(200, 500); ctx.stroke();
            drawCar(lane * 100, 420, "#ff2e63");
            obstacles.forEach(o => drawCar(o.lane * 100, o.y, "#00adb5"));
            update(); requestAnimationFrame(draw);
        }

        window.addEventListener('touchstart', e => {
            let mid = window.innerWidth / 2;
            if (e.touches[0].clientX < mid) { if (lane > 0) lane--; } else { if (lane < 2) lane++; }
        });
        draw();
    </script>
</body>
</html>
