<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; user-select: none; }
        canvas { background: #222; display: block; margin: 0 auto; max-width: 100%; max-height: 50vh; border-bottom: 4px solid #00adb5; }
        #score { position: absolute; top: 15px; left: 15px; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; padding: 10px; }
        .btn { width: 80px; height: 80px; background: #333; border: 3px solid #00adb5; border-radius: 50%; color: white; font-size: 30px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #00adb5; -webkit-user-select: none; }
        .btn:active { background: #00adb5; transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="score">امتیاز: 0</div>
    <canvas id="gameCanvas" width="640" height="360"></canvas>

    <div class="controls">
        <div class="btn" id="btnUp">🔺</div>
        <div class="btn" id="btnDown">🔻</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0;
        let gameOver = false;

        const player = { x: 60, y: 150, width: 35, height: 35, speed: 6 };
        const obstacles = [];
        let obstacleTimer = 0;

        let moveUp = false;
        let moveDown = false;

        document.getElementById("btnUp").addEventListener("touchstart", (e) => { e.preventDefault(); moveUp = true; });
        document.getElementById("btnUp").addEventListener("touchend", () => moveUp = false);
        document.getElementById("btnDown").addEventListener("touchstart", (e) => { e.preventDefault(); moveDown = true; });
        document.getElementById("btnDown").addEventListener("touchend", () => moveDown = false);

        document.getElementById("btnUp").addEventListener("mousedown", () => moveUp = true);
        document.getElementById("btnUp").addEventListener("mouseup", () => moveUp = false);
        document.getElementById("btnDown").addEventListener("mousedown", () => moveDown = true);
        document.getElementById("btnDown").addEventListener("mouseup", () => moveDown = false);

        function spawnObstacle() {
            const height = Math.random() * 50 + 20;
            // سرعت اولیه بسیار آرام (2.5) تنظیم شده و با افزایش امتیاز تندتر میشه
            const currentSpeed = 2.5 + (score * 0.3); 
            obstacles.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - height),
                width: 25,
                height: height,
                speed: currentSpeed > 10 ? 10 : currentSpeed // سقف سرعت برای اینکه غیرممکن نشه
            });
        }

        function update() {
            if (gameOver) return;

            if (moveUp && player.y > 0) player.y -= player.speed;
            if (moveDown && player.y < canvas.height - player.height) player.y += player.speed;

            obstacleTimer++;
            if (obstacleTimer % 60 === 0) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                if (player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y) {
                    gameOver = true;
                    alert("بازی تمام شد! امتیاز شما: " + score);
                    document.location.reload();
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreElement.innerText = "امتیاز: " + score;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00adb5";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00adb5";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            ctx.fillStyle = "#ff2e63";
            ctx.shadowColor = "#ff2e63";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
            ctx.shadowBlur = 0;
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
