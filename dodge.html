<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; touch-action: none; }
        canvas { background: #222; display: block; margin: 0 auto; max-width: 100%; max-height: 100vh; border-bottom: 4px solid #00adb5; }
        #score { position: absolute; top: 15px; left: 15px; font-size: 20px; font-weight: bold; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <div id="score">امتیاز: 0</div>
    <canvas id="gameCanvas" width="640" height="360"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        let score = 0;
        let gameOver = false;

        const player = { x: 60, y: 150, width: 35, height: 35, speed: 6 };
        const obstacles = [];
        let obstacleTimer = 0;

        let keys = {};
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);
        
        window.addEventListener("touchmove", e => {
            const touchY = e.touches[0].clientY - canvas.offsetTop;
            player.y = Math.max(0, Math.min(canvas.height - player.height, touchY - player.height/2));
        });

        function spawnObstacle() {
            const height = Math.random() * 40 + 20;
            obstacles.push({
                x: canvas.width,
                y: Math.random() * (canvas.height - height),
                width: 25,
                height: height,
                speed: 4 + (score * 0.2)
            });
        }

        function update() {
            if (gameOver) return;

            if (keys["ArrowUp"] && player.y > 0) player.y -= player.speed;
            if (keys["ArrowDown"] && player.y < canvas.height - player.height) player.y += player.speed;

            obstacleTimer++;
            if (obstacleTimer % 50 === 0) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= obstacles[i].speed;

                if (player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y) {
                    gameOver = true;
                    alert("بازی تمام شد! امتیاز: " + score);
                    document.location.reload();
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    scoreElement.innerText = "امتیاز: " + score;
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // بازیکن با افکت نئون سایان
            ctx.fillStyle = "#00adb5";
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00adb5";
            ctx.fillRect(player.x, player.y, player.width, player.height);

            // مانع‌ها با نئون صورتی
            ctx.fillStyle = "#ff2e63";
            ctx.shadowColor = "#ff2e63";
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }
            ctx.shadowBlur = 0; // ریست افکت برای فریم بعدی
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
