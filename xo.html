<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دوز ۳تایی حرفه‌ای</title>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; }
        .cell { width: 80px; height: 80px; background: #222; border: 2px solid #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        .x { color: #ff2e63; } .o { color: #4ecca3; }
    </style>
</head>
<body>
    <div class="board" id="board"></div>

    <script>
        let board = Array(9).fill(null);
        let countX = 0, countO = 0;
        let playerTurn = true;
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerHTML = val ? `<span class="${val.toLowerCase()}">${val}</span>` : '';
                cell.onclick = () => play(i);
                boardEl.appendChild(cell);
            });
        }

        function play(i) {
            if (playerTurn && countX < 3 && !board[i]) {
                board[i] = 'X';
                countX++;
                render();
                if (!checkWinner('X')) {
                    playerTurn = false;
                    setTimeout(aiMove, 600);
                }
            }
        }

        function aiMove() {
            let move = findBestMove();
            
            if (countO < 3) {
                board[move] = 'O';
                countO++;
            } else {
                // جابجایی هوشمند: مهره تصادفی از ربات حذف و در بهترین خانه قرار می‌گیرد
                let oPositions = board.map((v, i) => v === 'O' ? i : null).filter(v => v !== null);
                board[oPositions[Math.floor(Math.random() * oPositions.length)]] = null;
                board[move] = 'O';
            }
            render();
            checkWinner('O');
            playerTurn = true;
        }

        function findBestMove() {
            // ۱. آیا ربات می‌تواند ببرد؟
            for (let i = 0; i < 9; i++) {
                if (!board[i]) {
                    board[i] = 'O';
                    if (isWinning('O')) { board[i] = null; return i; }
                    board[i] = null;
                }
            }
            // ۲. آیا باید جلوی برد بازیکن را بگیرد؟
            for (let i = 0; i < 9; i++) {
                if (!board[i]) {
                    board[i] = 'X';
                    if (isWinning('X')) { board[i] = null; return i; }
                    board[i] = null;
                }
            }
            // ۳. حرکت تصادفی در خانه‌های خالی
            let empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            return empty[Math.floor(Math.random() * empty.length)];
        }

        function isWinning(p) {
            return wins.some(w => w.every(i => board[i] === p));
        }

        function checkWinner(p) {
            if (isWinning(p)) {
                alert('برنده: ' + (p === 'X' ? 'شما' : 'ربات'));
                location.reload();
                return true;
            }
            return false;
        }
        render();
    </script>
</body>
</html>
