<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دوز ۳تایی جابجایی</title>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(3, 90px); gap: 10px; }
        .cell { width: 90px; height: 90px; background: #222; border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 45px; cursor: pointer; }
        .x { color: #ff2e63; } .o { color: #4ecca3; }
        .selected { border: 2px solid #00adb5; }
    </style>
</head>
<body>
    <div id="status">مهره‌گذاری کنید (۳ مهره)</div>
    <div class="board" id="board"></div>
    <script>
        let board = Array(9).fill(null), countX = 0, countO = 0, selectedIndex = null, isPlayerTurn = true;
        const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        function render() {
            const boardEl = document.getElementById('board'); boardEl.innerHTML = '';
            board.forEach((val, i) => { const cell = document.createElement('div'); cell.className = 'cell' + (selectedIndex === i ? ' selected' : ''); cell.innerHTML = val ? `<span class="${val.toLowerCase()}">${val}</span>` : ''; cell.onclick = () => handleMove(i); boardEl.appendChild(cell); });
        }
        function handleMove(i) {
            if (!isPlayerTurn) return;
            if (countX < 3) { if (!board[i]) { board[i] = 'X'; countX++; checkAndNext(); } }
            else { if (board[i] === 'X') selectedIndex = i; else if (selectedIndex !== null && !board[i]) { board[selectedIndex] = null; board[i] = 'X'; selectedIndex = null; checkAndNext(); } }
            render();
        }
        function checkAndNext() { if (checkWin('X')) return; isPlayerTurn = false; setTimeout(aiMove, 800); }
        function aiMove() {
            if (countO < 3) { let e = board.map((v,i)=>v===null?i:null).filter(v=>v!==null); board[e[0]] = 'O'; countO++; }
            else { let oPos = board.map((v,i)=>v==='O'?i:null).filter(v=>v!==null); let e = board.map((v,i)=>v===null?i:null).filter(v=>v!==null); board[oPos[0]] = null; board[e[0]] = 'O'; }
            render(); if (!checkWin('O')) isPlayerTurn = true;
        }
        function isWinning(p) { return wins.some(w => w.every(idx => board[idx] === p)); }
        function checkWin(p) { if (isWinning(p)) { alert(p === 'X' ? "بردی!" : "باختی!"); location.reload(); return true; } return false; }
        render();
    </script>
</body>
</html>
