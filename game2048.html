<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        #grid { display: grid; grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); gap: 10px; background: #333; padding: 10px; border-radius: 10px; }
        .cell { width: 70px; height: 70px; background: #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="grid"></div>
    <script>
        let board = Array(16).fill(0);
        function draw() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            board.forEach(val => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = val || '';
                grid.appendChild(cell);
            });
        }
        function addNum() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if(empty.length > 0) board[empty[Math.floor(Math.random() * empty.length)]] = 2;
        }
        addNum(); addNum(); draw();
    </script>
</body>
</html>
