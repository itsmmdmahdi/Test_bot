<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; overflow: hidden; }
        #grid { display: grid; grid-template-columns: repeat(4, 70px); grid-template-rows: repeat(4, 70px); gap: 10px; background: #333; padding: 10px; border-radius: 10px; }
        .cell { width: 70px; height: 70px; background: #444; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="grid"></div>
    <script>
        let board = Array(16).fill(0);
        
        function draw() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            board.forEach(val => {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.innerText = val > 0 ? val : '';
                grid.appendChild(cell);
            });
        }

        function slide(row) {
            let arr = row.filter(val => val);
            let missing = 4 - arr.length;
            let zeros = Array(missing).fill(0);
            return arr.concat(zeros);
        }

        function combine(row) {
            for (let i = 0; i < 3; i++) {
                if (row[i] !== 0 && row[i] === row[i + 1]) {
                    row[i] *= 2;
                    row[i + 1] = 0;
                }
            }
            return row;
        }

        function move(dir) {
            let newBoard = Array(16).fill(0);
            // اینجا منطق ساده شده جابجایی برای همه جهت‌ها
            for (let i = 0; i < 4; i++) {
                let row = board.slice(i * 4, i * 4 + 4);
                if (dir === 'left') { row = combine(slide(row)); }
                for (let j = 0; j < 4; j++) newBoard[i * 4 + j] = row[j];
            }
            board = newBoard;
            addNum();
            draw();
        }

        function addNum() {
            let empty = board.map((v, i) => v === 0 ? i : null).filter(v => v !== null);
            if(empty.length > 0) board[empty[Math.floor(Math.random() * empty.length)]] = 2;
        }

        let startX, startY;
        document.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
        document.addEventListener('touchend', e => {
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                move(diffX > 0 ? 'right' : 'left');
            }
        });

        addNum(); addNum(); draw();
    </script>
</body>
</html>
