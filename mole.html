<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #2c3e50; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white; }
        .grid { display: grid; grid-template-columns: repeat(3, 80px); gap: 15px; }
        .hole { width: 80px; height: 80px; background: #8e44ad; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        .mole { transform: scale(1.2); }
        #score { font-size: 24px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="score">امتیاز: 0</div>
    <div class="grid" id="grid"></div>
    <script>
        const grid = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        let score = 0;
        let lastHole;

        // ایجاد ۹ سوراخ دایره‌ای
        for (let i = 0; i < 9; i++) {
            const hole = document.createElement('div');
            hole.className = 'hole';
            hole.onclick = () => { if(hole.innerText === '🐹') { score++; hole.innerText = ''; scoreEl.innerText = "امتیاز: " + score; } };
            grid.appendChild(hole);
        }

        function popUp() {
            const holes = document.querySelectorAll('.hole');
            let randomHole = holes[Math.floor(Math.random() * 9)];
            if(randomHole === lastHole) return popUp();
            randomHole.innerText = '🐹';
            lastHole = randomHole;
            setTimeout(() => randomHole.innerText = '', 800);
        }

        setInterval(popUp, 1000);
    </script>
</body>
</html>
