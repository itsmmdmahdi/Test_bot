<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PacMan</title>
</head>
<body>
    <canvas id="gameCanvas" width="340" height="340" style="background:#000; display:block; margin:auto;"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // تنظیمات بازیکن
        let pacman = { x: 40, y: 40, dx: 0, dy: 0 };
        // تنظیمات روح (قرمز)
        let ghost = { x: 300, y: 300 };

        function update() {
            // هوش مصنوعی تهاجمی: روح در هر فریم محاسبه می‌کند چگونه به پک‌من نزدیک شود
            if (ghost.x < pacman.x) ghost.x += 1.3;
            if (ghost.x > pacman.x) ghost.x -= 1.3;
            if (ghost.y < pacman.y) ghost.y += 1.3;
            if (ghost.y > pacman.y) ghost.y -= 1.3;

            // برخورد
            let dist = Math.hypot(ghost.x - pacman.x, ghost.y - pacman.y);
            if (dist < 15) {
                alert("گرفته شدی!");
                ghost.x = 300; ghost.y = 300; // ریست موقعیت روح
            }
        }

        function draw() {
            ctx.clearRect(0,0,340,340);
            // رسم پک‌من
            ctx.fillStyle = "yellow";
            ctx.beginPath(); ctx.arc(pacman.x, pacman.y, 10, 0, Math.PI*2); ctx.fill();
            // رسم روح
            ctx.fillStyle = "red";
            ctx.fillRect(ghost.x, ghost.y, 20, 20);
            
            update();
            requestAnimationFrame(draw);
        }

        // کنترل حرکت
        window.addEventListener('keydown', (e) => {
            if(e.key === "ArrowUp") { pacman.dx = 0; pacman.dy = -2; }
            if(e.key === "ArrowDown") { pacman.dx = 0; pacman.dy = 2; }
            if(e.key === "ArrowLeft") { pacman.dx = -2; pacman.dy = 0; }
            if(e.key === "ArrowRight") { pacman.dx = 2; pacman.dy = 0; }
        });

        // حلقه اصلی حرکت پک‌من
        setInterval(() => { pacman.x += pacman.dx; pacman.y += pacman.dy; }, 30);
        
        draw();
    </script>
</body>
</html>
