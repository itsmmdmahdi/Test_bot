<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOLEX Hub</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #2d1b4d 0%, #111 80%);
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* تایتل نئونی */
        .title-container {
            position: relative;
            margin-bottom: 50px;
        }
        .neon-text {
            font-size: 80px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff00ff;
        }
        .floral-halo {
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,0,255,0.2) 0%, transparent 70%);
            z-index: -1;
        }

        /* چیدمان ۲ در ۲ */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 300px;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #444;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .game-card:hover { border-color: #ff00ff; transform: scale(1.05); }

        /* دکمه بازگشت */
        .back-btn {
            margin-top: 50px;
            background: #8b0000; /* قرمز مات */
            color: white;
            padding: 15px 40px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <div class="floral-halo"></div>
        <div class="neon-text">SHOLEX</div>
    </div>

    <div class="game-grid">
        <div class="game-card">🐍<br>مار</div>
        <div class="game-card">❌<br>دوز</div>
        <div class="game-card">🧱<br>آجرشکن</div>
        <div class="game-card">🔢<br>۲۰۴۸</div>
    </div>

    <button class="back-button back-btn">بازگشت</button>

</body>
</html>
