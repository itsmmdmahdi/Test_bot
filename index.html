<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>هاب بازی‌های شولکس</title>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; }
        header { padding: 20px; border-bottom: 3px solid #00adb5; }
        .menu-section { margin-top: 20px; padding: 10px; }
        h2 { color: #00adb5; font-size: 18px; border-bottom: 1px solid #333; display: inline-block; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; max-width: 500px; margin: 0 auto; }
        .game-card { background: #222; border: 2px solid #333; border-radius: 15px; padding: 15px; cursor: pointer; transition: 0.2s; }
        .game-card:active { border-color: #00adb5; transform: scale(0.95); }
        .game-icon { font-size: 30px; margin-bottom: 5px; }
        iframe { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #111; z-index: 999; }
        #backBtn { display: none; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #ff2e63; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 25px; z-index: 10000; box-shadow: 0 4px 15px rgba(255, 46, 99, 0.5); }
    </style>
</head>
<body>
    <header><h1>🎮 هاب شولکس</h1></header>
    <div class="menu-section">
        <h2>👤 بازی‌های تکی</h2>
        <div class="grid">
            <div class="game-card" onclick="openGame('snake.html')"><div class="game-icon">🐍</div><div>مار بازی</div></div>
            <div class="game-card" onclick="openGame('game2048.html')"><div class="game-icon">🔢</div><div>بازی ۲۰۴۸</div></div>
            <div class="game-card" onclick="openGame('breakout.html')"><div class="game-icon">🧱</div><div>آجرشکن</div></div>
            <div class="game-card" onclick="openGame('car_dodge.html')"><div class="game-icon">🏎️</div><div>کار داج</div></div>
        </div>
    </div>
    <div class="menu-section">
        <h2>👥 بازی‌های دونفره</h2>
        <div class="grid">
            <div class="game-card" onclick="openGame('xo_multi.html')"><div class="game-icon">❌</div><div>دوز دونفره</div></div>
        </div>
    </div>
    <button id="backBtn" onclick="closeGame()">خروج از بازی</button>
    <iframe id="gameFrame"></iframe>
    <script>
        function openGame(url) {
            document.getElementById("gameFrame").src = url;
            document.getElementById("gameFrame").style.display = "block";
            document.getElementById("backBtn").style.display = "block";
        }
        function closeGame() {
            document.getElementById("gameFrame").src = "";
            document.getElementById("gameFrame").style.display = "none";
            document.getElementById("backBtn").style.display = "none";
        }
    </script>
</body>
</html>
