<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sholex Game Hub</title>
    <style>
        body { margin: 0; padding: 20px; background: linear-gradient(135deg, #111, #222); color: white; font-family: sans-serif; text-align: center; }
        h1 { font-size: 24px; margin-bottom: 20px; color: #00adb5; }
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; max-width: 500px; margin: 0 auto; }
        .game-card { background: #333; border: 2px solid #444; border-radius: 15px; padding: 20px 10px; cursor: pointer; transition: 0.2s; }
        .game-card:active { transform: scale(0.95); border-color: #00adb5; }
        .game-icon { font-size: 40px; margin-bottom: 10px; }
        .game-title { font-size: 16px; font-weight: bold; }
        .back-btn { position: fixed; top: 10px; right: 10px; background: #ff2e63; color: white; border: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; display: none; z-index: 100; }
        iframe { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: none; background: #111; }
    </style>
</head>
<body>

    <div id="main-menu">
        <h1>🎮 هاب بازی اختصاصی شولکس</h1>
        <div class="grid-container">
            <div class="game-card" onclick="openGame('dodge.html')">
                <div class="game-icon">🤖</div>
                <div class="game-title">ربات جاخالی (ارتقا یافته)</div>
            </div>
            <div class="game-card" onclick="openGame('snake.html')">
                <div class="game-icon">🐍</div>
                <div class="game-title">مار بازی کلاسیک</div>
            </div>
        </div>
    </div>

    <button id="back-button" class="back-btn" onclick="closeGame()">🔙 خروج</button>
    <iframe id="game-frame" src=""></iframe>

    <script>
        const mainMenu = document.getElementById('main-menu');
        const gameFrame = document.getElementById('game-frame');
        const backButton = document.getElementById('back-button');

        function openGame(page) {
            mainMenu.style.display = 'none';
            gameFrame.src = page;
            gameFrame.style.display = 'block';
            backButton.style.display = 'block';
        }

        function closeGame() {
            gameFrame.style.display = 'none';
            gameFrame.src = "";
            backButton.style.display = 'none';
            mainMenu.style.display = 'block';
        }
    </script>
</body>
</html>
