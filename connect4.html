<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>چهار در یک ردیف</title>
    <style>
        body { background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(7, 50px); gap: 5px; background: #0f3460; padding: 10px; border-radius: 10px; }
        .cell { width: 50px; height: 50px; background: #16213e; border-radius: 50%; }
        .red { background: #ff2e63; }
        .yellow { background: #ffc93c; }
    </style>
</head>
<body>
    <div class="board" id="board"></div>
    <script>
        const board = Array(6).fill(null).map(() => Array(7).fill(null));
        let player = 'red';
        const boardEl = document.getElementById('board');

        function render() {
            boardEl.innerHTML = '';
            for(let r=0; r<6; r++) {
                for(let c=0; c<7; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell ' + (board[r][c] || '');
                    cell.onclick = () => drop(c);
                    boardEl.appendChild(cell);
                }
            }
        }

        function drop(c) {
            for(let r=5; r>=0; r--) {
                if(!board[r][c]) {
                    board[r][c] = player;
                    player = player === 'red' ? 'yellow' : 'red';
                    render(); return;
                }
            }
        }
        render();
    </script>
</body>
</html>
