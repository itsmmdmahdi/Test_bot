<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; user-select: none; }
        canvas { background: #222; display: block; margin: 0 auto; max-width: 100%; max-height: 50vh; border-bottom: 4px solid #00adb5; }
        #hud { position: absolute; top: 15px; left: 15px; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; text-align: right; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn { width: 80px; height: 80px; background: #333; border: 3px solid #00adb5; border-radius: 50%; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #00adb5; -webkit-user-select: none; }
        .btn:active { background: #00adb5; transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="hud">
        <div>امتیاز: <span id="score">0</span></div>
        <div style="color: #00adb5;">رکورد: <span id="highscore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="600" height="250"></canvas>

    <div class="controls">
        <div class="btn" id="jumpBtn">🔺<br><span style="font-size:10px">پرش</span></div>
        <div class="btn" id="duckBtn">🔻<br><span style="font-size:10px">خم</span></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highscoreElement = document.getElementById("highscore");

        let score = 0; let gameOver = false;
        let highscore = localStorage.getItem("dino_highscore") || 0;
        highscoreElement.innerText = highscore;

        const dino = { x: 40, y: 170, w: 30, h: 40, origH: 40, gravity: 0.6, velocity: 0, jump: -11, isGrounded: true };
        const obstacles = []; let obstacleTimer = 0; let speed = 4.5;

        document.getElementById("jumpBtn").addEventListener("touchstart", (e) => { e.preventDefault(); if(dino.isGrounded) { dino.velocity = dino.jump; dino.isGrounded = false; } });
        document.getElementById("jumpBtn").addEventListener("mousedown", () => { if(dino.isGrounded) { dino.velocity = dino.jump; dino.isGrounded = false; } });
        
        document.getElementById("duckBtn").addEventListener("touchstart", (e) => { e.preventDefault(); if(dino.isGrounded) { dino.h = 20; dino.y = 190; } });
        document.getElementById("duckBtn").addEventListener("touchend", () => { dino.h = dino.origH; dino.y = 170; });
        document.getElementById("duckBtn").addEventListener("mousedown", () => { if(dino.isGrounded) { dino.h = 20; dino.y = 190; } });
        document.getElementById("duckBtn").addEventListener("mouseup", () => { dino.h = dino.origH; dino.y = 170; });

        function spawnObstacle() {
            let type = Math.random() > 0.4 ? 'cactus' : 'bird';
            if (type === 'cactus') { obstacles.push({ x: canvas.width, y: 175, w: 20, h: 35, type: 'cactus' }); }
            else { obstacles.push({ x: canvas.width, y: 145, w: 25, h: 15, type: 'bird' }); }
        }

        function update() {
            if (gameOver) return;
            score++; scoreElement.innerText = Math.floor(score/5);
            speed += 0.001;

            dino.velocity += dino.gravity; dino.y += dino.velocity;
            if (dino.y >= 170 && dino.h === dino.origH) { dino.y = 170; dino.velocity = 0; dino.isGrounded = true; }
            if (dino.y >= 190 && dino.h === 20) { dino.y = 190; dino.velocity = 0; dino.isGrounded = true; }

            if (obstacleTimer++ % 90 === 0) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= speed;
                if (dino.x < obstacles[i].x + obstacles[i].w && dino.x + dino.w > obstacles[i].x && dino.y < obstacles[i].y + obstacles[i].h && dino.y + dino.h > obstacles[i].y) {
                    gameOver = true;
                    let finalScore = Math.floor(score/5);
                    if (finalScore > highscore) { localStorage.setItem("dino_highscore", finalScore); alert("🎉 رکورد جدید: " + finalScore); }
                    else { alert("بازی تمام شد! امتیاز: " + finalScore); }
                    document.location.reload();
                }
                if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#444"; ctx.beginPath(); ctx.moveTo(0, 210); ctx.lineTo(canvas.width, 210); ctx.stroke();
            ctx.fillStyle = "#00adb5"; ctx.shadowBlur = 8; ctx.shadowColor = "#00adb5";
            ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
            ctx.fillStyle = "#ff2e63"; ctx.shadowColor = "#ff2e63";
            for (let o of obstacles) ctx.fillRect(o.x, o.y, o.w, o.h);
            ctx.shadowBlur = 0;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
