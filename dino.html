<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; user-select: none; }
        canvas { background: #1e1e1e; display: block; margin: 0 auto; max-width: 100%; max-height: 50vh; border-bottom: 4px solid #ff2e63; }
        #hud { position: absolute; top: 15px; left: 15px; font-size: 16px; font-weight: bold; background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px; text-align: right; }
        .controls { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        .btn { width: 85px; height: 85px; background: #252525; border: 3px solid #00adb5; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: 0 0 10px #00adb5; -webkit-user-select: none; }
        .btn:active { background: #00adb5; transform: scale(0.9); }
        #hint { font-size: 14px; color: #aaa; margin-top: 5px; height: 15px; }
    </style>
</head>
<body>
    <div id="hud">
        <div>امتیاز: <span id="score">0</span></div>
        <div style="color: #00adb5;">رکورد: <span id="highscore">0</span></div>
    </div>
    <canvas id="gameCanvas" width="600" height="250"></canvas>
    <div id="hint">برای شروع، دکمه پرش یا خم شدن را بزنید</div>

    <div class="controls">
        <div class="btn" id="jumpBtn">🔺<span style="font-size:11px">پرش</span></div>
        <div class="btn" id="duckBtn">🔻<span style="font-size:11px">خم شدن</span></div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score"); const highscoreElement = document.getElementById("highscore");
        const hintElement = document.getElementById("hint");

        let score = 0; let gameOver = false; let gameStarted = false;
        let highscore = localStorage.getItem("dino_highscore") || 0; highscoreElement.innerText = highscore;

        const dino = { x: 50, y: 165, w: 32, h: 45, origH: 45, gravity: 0.55, velocity: 0, jump: -11.5, isGrounded: true, radius: 10 };
        const obstacles = []; let obstacleTimer = 0; let speed = 3.2; 

        function startEvent() { if (!gameStarted) { gameStarted = true; hintElement.style.opacity = "0"; } }

        function jumpAction() { startEvent(); if(dino.isGrounded && dino.h === dino.origH) { dino.velocity = dino.jump; dino.isGrounded = false; } }
        function duckAction() { startEvent(); if(dino.isGrounded) { dino.h = 24; dino.y = 186; dino.radius = 6; } } 
        function stopDuck() { dino.h = dino.origH; dino.y = 165; dino.radius = 10; } 

        document.getElementById("jumpBtn").addEventListener("touchstart", (e) => { e.preventDefault(); jumpAction(); });
        document.getElementById("jumpBtn").addEventListener("mousedown", jumpAction);
        
        document.getElementById("duckBtn").addEventListener("touchstart", (e) => { e.preventDefault(); duckAction(); });
        document.getElementById("duckBtn").addEventListener("touchend", stopDuck);
        document.getElementById("duckBtn").addEventListener("mousedown", duckAction);
        document.getElementById("duckBtn").addEventListener("mouseup", stopDuck);

        function spawnObstacle() {
            if (!gameStarted || gameOver) return;
            let type = Math.random() > 0.45 ? 'cactus' : 'bird';
            if (type === 'cactus') { 
                obstacles.push({ x: canvas.width, y: 170, w: 22, h: 40, r: 6 }); 
            } else { 
                obstacles.push({ x: canvas.width, y: 140, w: 30, h: 20, r: 4 }); 
            }
        }

        function update() {
            if (!gameStarted || gameOver) return;
            score++; scoreElement.innerText = Math.floor(score/6);
            speed += 0.0008; 

            dino.velocity += dino.gravity; dino.y += dino.velocity;
            if (dino.y >= 165 && dino.h === dino.origH) { dino.y = 165; dino.velocity = 0; dino.isGrounded = true; }
            if (dino.y >= 186 && dino.h === 24) { dino.y = 186; dino.velocity = 0; dino.isGrounded = true; }

            if (obstacleTimer++ % 95 === 0) spawnObstacle();

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= speed;
                
                if (dino.x < obstacles[i].x + obstacles[i].w && dino.x + dino.w > obstacles[i].x && dino.y < obstacles[i].y + obstacles[i].h && dino.y + dino.h > obstacles[i].y) {
                    gameOver = true; let finalScore = Math.floor(score/6);
                    if (finalScore > highscore) { localStorage.setItem("dino_highscore", finalScore); alert("🎉 رکورد جدید: " + finalScore); }
                    else { alert("بازی تمام شد! امتیاز: " + finalScore); }
                    document.location.reload();
                }
                if (obstacles[i].x + obstacles[i].w < 0) obstacles.splice(i, 1);
            }
        }

        function defDrawRoundRect(x, y, width, height, radius, color, blurColor) {
            ctx.fillStyle = color; ctx.shadowBlur = 10; ctx.shadowColor = blurColor;
            ctx.beginPath();
            if (ctx.roundRect) {
                ctx.roundRect(x, y, width, height, radius);
            } else {
                ctx.rect(x, y, width, height); // پشتیبانی از مرورگرهای قدیمی‌تر تلگرام
            }
            ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = "#333"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 210); ctx.lineTo(canvas.width, 210); ctx.stroke();

            defDrawRoundRect(dino.x, dino.y, dino.w, dino.h, dino.radius, "#00adb5", "#00adb5");

            for (let o of obstacles) {
                defDrawRoundRect(o.x, o.y, o.w, o.h, o.r, "#ff2e63", "#ff2e63");
            }
            ctx.shadowBlur = 0;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
