<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>مار بازی</title>
    <style>
        body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; touch-action: none; color: white; font-family: sans-serif; }
        canvas { background: #222; border: 4px solid #00adb5; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="score">امتیاز: 0</div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        let score = 0;
        let snake = [{x: 150, y: 150}];
        let food = {x: 100, y: 100};
        let dx = 10, dy = 0;

        function draw() {
            ctx.clearRect(0, 0, 300, 300);
            
            // رسم غذا
            ctx.fillStyle = "#ff2e63";
            ctx.fillRect(food.x, food.y, 10, 10);

            // رسم مار
            ctx.fillStyle = "#4ecca3";
            snake.forEach(part => ctx.fillRect(part.x, part.y, 10, 10));

            // منطق حرکت
            let head = {x: snake[0].x + dx, y: snake[0].y + dy};
            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('score').innerText = "امتیاز: " + score;
                food = {x: Math.floor(Math.random()*30)*10, y: Math.floor(Math.random()*30)*10};
            } else {
                snake.pop();
            }

            if (head.x < 0 || head.x >= 300 || head.y < 0 || head.y >= 300) { alert("باختی! امتیاز: " + score); location.reload(); }
            setTimeout(draw, 100);
        }

        // کنترل لمسی (Swipe)
        let startX, startY;
        window.addEventListener('touchstart', e => { startX = e.touches[0].clientX; startY = e.touches[0].clientY; });
        window.addEventListener('touchend', e => {
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0 && dx === 0) { dx = 10; dy = 0; }
                else if (diffX < 0 && dx === 0) { dx = -10; dy = 0; }
            } else {
                if (diffY > 0 && dy === 0) { dx = 0; dy = 10; }
                else if (diffY < 0 && dy === 0) { dx = 0; dy = -10; }
            }
        });
        draw();
    </script>
</body>
</html>
