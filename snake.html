<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; }
        canvas { background: #1a1a1a; display: block; margin: 10px auto; max-width: 95%; max-height: 80vh; border: 2px solid #333; }
        #score { font-size: 20px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>
    <div id="score">امتیاز مار: 0</div>
    <canvas id="snakeCanvas" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        const grid = 20;
        let count = 0;
        let score = 0;

        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [{x: 160, y: 160}, {x: 140, y: 160}], maxCells: 4 };
        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

        function resetGame() {
            snake.x = 160; snake.y = 160; snake.cells = [{x: 160, y: 160}]; snake.maxCells = 4;
            snake.dx = grid; snake.dy = 0; score = 0; scoreElement.innerText = "امتیاز مار: " + score;
            apple.x = getRandomInt(0, 20) * grid; apple.y = getRandomInt(0, 20) * grid;
        }

        function loop() {
            requestAnimationFrame(loop);
            if (++count < 6) return; // کنترل سرعت مار
            count = 0;

            ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx; snake.y += snake.dy;

            if (snake.x < 0) snake.x = canvas.width - grid;
            else if (snake.x >= canvas.width) snake.x = 0;
            if (snake.y < 0) snake.y = canvas.height - grid;
            else if (snake.y >= canvas.height) snake.y = 0;

            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            // رسم سیب
            ctx.fillStyle = '#ff2e63';
            ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

            // رسم مار
            ctx.fillStyle = '#00adb5';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score++;
                    scoreElement.innerText = "امتیاز مار: " + score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        alert("مار خودش رو خورد! بازی ریست شد.");
                        resetGame();
                    }
                }
            });
        }

        // کنترل با کیبورد و لمس سر دادن (Swipe)
        document.addEventListener('keydown', function(e) {
            if (e.which === 37 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (e.which === 38 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (e.which === 39 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (e.which === 40 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        });

        let touchstartX = 0; let touchstartY = 0;
        document.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; touchstartY = e.changedTouches[0].screenY; });
        document.addEventListener('touchend', e => {
            let tendX = e.changedTouches[0].screenX; let tendY = e.changedTouches[0].screenY;
            let xDiff = tendX - touchstartX; let yDiff = tendY - touchstartY;
            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 0 && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
                else if (xDiff < 0 && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            } else {
                if (yDiff > 0 && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
                else if (yDiff < 0 && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            }
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
