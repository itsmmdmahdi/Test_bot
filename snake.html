<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; user-select: none; }
        #hud { display: flex; justify-content: space-around; font-size: 18px; font-weight: bold; margin-top: 10px; padding: 0 20px; }
        canvas { background: #1a1a1a; display: block; margin: 10px auto; max-width: 90%; max-height: 45vh; border: 2px solid #333; }
        .dpad { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); gap: 5px; justify-content: center; margin-top: 15px; }
        .dbtn { background: #222; border: 2px solid #ff2e63; color: white; font-size: 24px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 12px; box-shadow: 0 0 8px #ff2e63; -webkit-user-select: none; }
        .dbtn:active { background: #ff2e63; transform: scale(0.95); }
        .empty { background: transparent; border: none; box-shadow: none; }
        #hint { font-size: 14px; color: #aaa; margin-top: 2px; height: 15px; }
    </style>
</head>
<body>
    <div id="hud">
        <div>امتیاز: <span id="score">0</span></div>
        <div style="color: #ff2e63;">رکورد: <span id="highscore">0</span></div>
    </div>
    
    <canvas id="snakeCanvas" width="400" height="400"></canvas>
    <div id="hint">برای شروع بازی، یکی از دکمه‌های زیر را بزنید</div>

    <div class="dpad">
        <div class="empty"></div>
        <div class="dbtn" id="w">🔼</div>
        <div class="empty"></div>
        <div class="dbtn" id="a">◀️</div>
        <div class="empty" style="background:#333; border-radius:5px;"></div>
        <div class="dbtn" id="d">▶️</div>
        <div class="empty"></div>
        <div class="dbtn" id="s">🔽</div>
        <div class="empty"></div>
    </div>

    <script>
        const canvas = document.getElementById("snakeCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");
        const highscoreElement = document.getElementById("highscore");
        const hintElement = document.getElementById("hint");

        const grid = 20;
        let count = 0;
        let score = 0;
        let isDead = false;
        let gameStarted = false; // متغیر وضعیت شروع بازی

        let highscore = localStorage.getItem("snake_highscore") || 0;
        highscoreElement.innerText = highscore;

        let snake = { x: 160, y: 160, dx: grid, dy: 0, cells: [{x: 160, y: 160}, {x: 140, y: 160}], maxCells: 4 };
        let apple = { x: 320, y: 320 };

        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min)) + min; }

        function checkAndSaveHighScore() {
            if (score > highscore) {
                localStorage.setItem("snake_highscore", score);
                alert("🎉 عالی بود! رکورد جدید برای مار ثبت شد: " + score);
            } else {
                alert("بازی تمام شد! امتیاز شما: " + score);
            }
        }

        function resetGame() {
            snake.x = 160; snake.y = 160; snake.cells = [{x: 160, y: 160}, {x: 140, y: 160}]; snake.maxCells = 4;
            snake.dx = grid; snake.dy = 0; score = 0; scoreElement.innerText = score;
            highscore = localStorage.getItem("snake_highscore") || 0;
            highscoreElement.innerText = highscore;
            apple.x = getRandomInt(0, 20) * grid; apple.y = getRandomInt(0, 20) * grid;
            isDead = false;
            gameStarted = false; // ریست شدن وضعیت شروع در زمان باخت
            hintElement.style.opacity = "1";
        }

        function changeDirection(dir) {
            if (isDead) return;
            
            // به محض زدن اولین دکمه، بازی شروع می‌شود
            if (!gameStarted) {
                gameStarted = true;
                hintElement.style.opacity = "0"; // پنهان کردن متن راهنما
            }

            if (dir === 'left' && snake.dx === 0) { snake.dx = -grid; snake.dy = 0; }
            else if (dir === 'up' && snake.dy === 0) { snake.dy = -grid; snake.dx = 0; }
            else if (dir === 'right' && snake.dx === 0) { snake.dx = grid; snake.dy = 0; }
            else if (dir === 'down' && snake.dy === 0) { snake.dy = grid; snake.dx = 0; }
        }

        document.getElementById("w").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection('up'); });
        document.getElementById("a").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection('left'); });
        document.getElementById("s").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection('down'); });
        document.getElementById("d").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection('right'); });
        
        document.getElementById("w").addEventListener("mousedown", () => changeDirection('up'));
        document.getElementById("a").addEventListener("mousedown", () => changeDirection('left'));
        document.getElementById("s").addEventListener("mousedown", () => changeDirection('down'));
        document.getElementById("d").addEventListener("mousedown", () => changeDirection('right'));

        function loop() {
            requestAnimationFrame(loop);
            
            // رسم محیط بازی حتی در زمان متوقف بودن (برای اینکه صفحه اول بازی خالی نباشه)
            if (!gameStarted) {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                // رسم سیب
                ctx.fillStyle = '#ff2e63';
                ctx.fillRect(apple.x, apple.y, grid-1, grid-1);
                // رسم مار ثابت
                ctx.fillStyle = '#00adb5';
                snake.cells.forEach(cell => ctx.fillRect(cell.x, cell.y, grid-1, grid-1));
                return; 
            }

            if (++count < 12) return; 
            count = 0;

            if (isDead) return;

            ctx.clearRect(0,0,canvas.width,canvas.height);
            snake.x += snake.dx; snake.y += snake.dy;

            if (snake.x < 0 || snake.x >= canvas.width || snake.y < 0 || snake.y >= canvas.height) {
                isDead = true;
                checkAndSaveHighScore();
                resetGame();
                return;
            }

            snake.cells.unshift({x: snake.x, y: snake.y});
            if (snake.cells.length > snake.maxCells) snake.cells.pop();

            ctx.fillStyle = '#ff2e63';
            ctx.fillRect(apple.x, apple.y, grid-1, grid-1);

            ctx.fillStyle = '#00adb5';
            snake.cells.forEach(function(cell, index) {
                ctx.fillRect(cell.x, cell.y, grid-1, grid-1);
                
                if (cell.x === apple.x && cell.y === apple.y) {
                    snake.maxCells++;
                    score++;
                    scoreElement.innerText = score;
                    apple.x = getRandomInt(0, 20) * grid;
                    apple.y = getRandomInt(0, 20) * grid;
                }
                
                for (let i = index + 1; i < snake.cells.length; i++) {
                    if (cell.x === snake.cells[i].x && cell.y === snake.cells[i].y) {
                        isDead = true;
                        checkAndSaveHighScore();
                        resetGame();
                        return;
                    }
                }
            });
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
