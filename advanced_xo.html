<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دوز پیشرفته</title>
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 10px; }
        .cell { width: 80px; height: 80px; background: #222; border: 2px solid #333; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        .x { color: #ff2e63; } .o { color: #4ecca3; }
        .selected { border: 2px solid #00adb5; }
    </style>
</head>
<body>
    <div class="board" id="board"></div>
    <div id="status" style="margin-top:20px;">نوبت: X (مهره بگذارید)</div>

    <script>
        let board = Array(9).fill(null);
        let turn = 'X';
        let countX = 0, countO = 0;
        let selected = null;

        function render() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            board.forEach((val, i) => {
                const cell = document.createElement('div');
                cell.className = 'cell' + (selected === i ? ' selected' : '');
                cell.innerHTML = val ? `<span class="${val.toLowerCase()}">${val}</span>` : '';
                cell.onclick = () => handleCell(i);
                boardEl.appendChild(cell);
            });
        }

        function handleCell(i) {
            // مرحله اول: گذاشتن مهره
            if ((turn === 'X' && countX < 3) || (turn === 'O' && countO < 3)) {
                if (!board[i]) {
                    board[i] = turn;
                    turn === 'X' ? countX++ : countO++;
                    checkWinner();
                    turn = turn === 'X' ? 'O' : 'X';
                }
            } 
            // مرحله دوم: حرکت دادن (Slide)
            else {
                if (selected === null && board[i] === turn) {
                    selected = i;
                } else if (selected !== null && !board[i]) {
                    board[i] = turn;
                    board[selected] = null;
                    selected = null;
                    checkWinner();
                    turn = turn === 'X' ? 'O' : 'X';
                }
            }
            render();
            document.getElementById('status').innerText = "نوبت: " + turn;
        }

        function checkWinner() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for(let w of wins) {
                if(board[w[0]] && board[w[0]] === board[w[1]] && board[w[0]] === board[w[2]]) {
                    alert('برنده: ' + board[w[0]]); location.reload();
                }
            }
        }
        render();
    </script>
</body>
</html>
