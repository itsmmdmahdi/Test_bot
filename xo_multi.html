<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #111; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 5px; }
        .cell { width: 80px; height: 80px; background: #222; border: 2px solid #00adb5; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
        #status { margin-bottom: 20px; font-size: 20px; color: #00adb5; }
    </style>
</head>
<body>
    <div id="status">نوبت: بازیکن X</div>
    <div class="board" id="board"></div>
    <script>
        let board = Array(9).fill(null);
        let player = 'X';
        const boardEl = document.getElementById('board');
        const statusEl = document.getElementById('status');

        function checkWinner() {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) {
                if (board[w[0]] && board[w[0]] === board[w[1]] && board[w[1]] === board[w[2]]) return board[w[0]];
            }
            return board.includes(null) ? null : 'مساوی';
        }

        board.forEach((_, i) => {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.onclick = () => {
                if (board[i] || checkWinner()) return;
                board[i] = player;
                cell.innerText = player;
                let winner = checkWinner();
                if (winner) statusEl.innerText = winner === 'مساوی' ? 'بازی مساوی شد!' : 'برنده: ' + winner;
                else { player = player === 'X' ? 'O' : 'X'; statusEl.innerText = 'نوبت: بازیکن ' + player; }
            };
            boardEl.appendChild(cell);
        });
    </script>
</body>
</html>
