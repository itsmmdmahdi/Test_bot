<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; text-align: center; overflow: hidden; user-select: none; }
        canvas { background: #1a1a1a; display: block; margin: 10px auto; max-width: 90%; max-height: 50vh; border: 2px solid #333; }
        #hud { font-size: 18px; font-weight: bold; margin-top: 10px; color: #00adb5; }
        .controls { display: flex; justify-content: center; gap: 30px; margin-top: 15px; }
        .btn { width: 80px; height: 80px; background: #333; border: 3px solid #00adb5; border-radius: 50%; color: white; font-size: 30px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 10px #00adb5; -webkit-user-select: none; }
        .btn:active { background: #00adb5; transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="hud">امتیاز شما: <span id="score">0</span> | رکورد: <span id="highscore">0</span></div>
    <canvas id="gameCanvas" width="360" height="400"></canvas>

    <div class="controls">
        <div class="btn" id="leftBtn">◀️</div>
        <div class="btn" id="rightBtn">▶️</div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score"); const highscoreElement = document.getElementById("highscore");

        let score = 0; let gameOver = false;
        let highscore = localStorage.getItem("break_highscore") || 0; highscoreElement.innerText = highscore;

        const paddle = { w: 70, h: 12, x: 145, y: 370, speed: 6 };
        const ball = { x: 180, y: 250, radius: 7, dx: 3, dy: -3 };

        const brickRows = 4; const brickCols = 5; const brickW = 60; const brickH = 15; const brickPadding = 7; const brickOffsetTop = 30; const brickOffsetLeft = 15;
        let bricks = [];
        for(let c=0; c<brickCols; c++) { bricks[c] = []; for(let r=0; r<brickRows; r++) { bricks[c][r] = { x: 0, y: 0, status: 1 }; } }

        let moveLeft = false; let moveRight = false;
        document.getElementById("leftBtn").addEventListener("touchstart", (e) => { e.preventDefault(); moveLeft = true; });
        document.getElementById("leftBtn").addEventListener("touchend", () => moveLeft = false);
        document.getElementById("rightBtn").addEventListener("touchstart", (e) => { e.preventDefault(); moveRight = true; });
        document.getElementById("rightBtn").addEventListener("touchend", () => moveRight = false);

        function update() {
            if (gameOver) return;
            if (moveLeft && paddle.x > 0) paddle.x -= paddle.speed;
            if (moveRight && paddle.x < canvas.width - paddle.w) paddle.x += paddle.speed;

            ball.x += ball.dx; ball.y += ball.dy;
            if(ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) ball.dx = -ball.dx;
            if(ball.y - ball.radius < 0) ball.dy = -ball.dy;

            if(ball.y + ball.radius > paddle.y && ball.x > paddle.x && ball.x < paddle.x + paddle.w) { ball.dy = -ball.dy; ball.y = paddle.y - ball.radius; }
            else if(ball.y + ball.radius > canvas.height) {
                gameOver = true;
                if (score > highscore) { localStorage.setItem("break_highscore", score); alert("🎉 رکورد جدید: " + score); }
                else { alert("بازی تمام شد!"); }
                document.location.reload();
            }

            for(let c=0; c<brickCols; c++) {
                for(let r=0; r<brickRows; r++) {
                    let b = bricks[c][r];
                    if(b.status == 1) {
                        if(ball.x > b.x && ball.x < b.x+brickW && ball.y > b.y && ball.y < b.y+brickH) {
                            ball.dy = -ball.dy; b.status = 0; score++; scoreElement.innerText = score;
                            if(score === brickRows * brickCols) { alert("🏆 تبریک! شما کل آجرها رو شکوندید!"); document.location.reload(); }
                        }
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00adb5"; ctx.shadowBlur = 8; ctx.shadowColor = "#00adb5";
            ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
            ctx.fillStyle = "#fff"; ctx.shadowColor = "#fff";
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = "#ff2e63"; ctx.shadowColor = "#ff2e63";
            for(let c=0; c<brickCols; c++) {
                for(let r=0; r<brickRows; r++) {
                    if(bricks[c][r].status == 1) {
                        let brickX = (c*(brickW+brickPadding))+brickOffsetLeft; let brickY = (r*(brickH+brickPadding))+brickOffsetTop;
                        bricks[c][r].x = brickX; bricks[c][r].y = brickY;
                        ctx.fillRect(brickX, brickY, brickW, brickH);
                    }
                }
            }
            ctx.shadowBlur = 0;
        }

        function loop() { update(); draw(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
